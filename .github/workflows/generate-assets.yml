name: Generate Profile Assets

on:
  schedule:
    # Refresh snake, 3D calendar, and analytics from live GitHub data.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches-ignore:
      - output

concurrency:
  group: profile-assets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # ── Snake (reads live contribution grid) ──────────────────────────────
      - name: Generate snake SVGs from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23e11d48&color_dots[0]=%23ebedf0&color_dots[1]=%23c6e48b&color_dots[2]=%237bc96f&color_dots[3]=%23239a3b&color_dots[4]=%23196127
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23f97316&color_dots[0]=%230d1117&color_dots[1]=%230e4429&color_dots[2]=%23006d32&color_dots[3]=%2326a641&color_dots[4]=%2339d353

      # ── 3D Calendar ───────────────────────────────────────────────────────
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # ── Analytics cards (cached on output branch — avoids camo/proxy failures) ─
      - name: Generate activity graph from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUTPUT_PATH: dist/analytics/activity-graph.svg
        run: |
          mkdir -p dist/analytics
          python3 .github/scripts/generate-activity-graph.py

      - name: Generate trophies from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUTPUT_PATH: dist/analytics/trophies.svg
        run: python3 .github/scripts/generate-trophies.py

      - name: Fetch live analytics images
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p dist/analytics

          fetch() {
            local url="$1"
            local out="$2"
            echo "Fetching $out"
            curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
              -A "Timeless-Dave-profile-assets" \
              "$url" -o "$out"
            if [ ! -s "$out" ]; then
              echo "Empty response for $out"
              exit 1
            fi
          }

          fetch \
            "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=${USERNAME}&theme=tokyonight" \
            "dist/analytics/stats.svg"

          fetch \
            "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=${USERNAME}&theme=tokyonight" \
            "dist/analytics/repos-per-language.svg"

          fetch \
            "https://streak-stats.demolab.com/?user=${USERNAME}&hide_border=true&background=0d1117&ring=a78bfa&fire=f97316&currStreakLabel=a78bfa&sideNums=c9d1d9&sideLabels=c9d1d9&dates=8b949e&stroke=0d1117" \
            "dist/analytics/streak.svg"

          echo "Analytics assets:"
          ls -la dist/analytics/

      # ── Collect into dist/ ────────────────────────────────────────────────
      - name: Collect all output files
        run: |
          mkdir -p dist/profile-3d-contrib
          if ls profile-3d-contrib/*.svg 1>/dev/null 2>&1; then
            cp profile-3d-contrib/*.svg dist/profile-3d-contrib/
            echo "3D files copied:"
            ls dist/profile-3d-contrib/
          else
            echo "No 3D SVG files found in profile-3d-contrib/"
          fi

          echo "Snake files:"
          ls -la dist/*.svg 2>/dev/null || { echo "No snake SVGs generated"; exit 1; }

          for file in dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg; do
            if [ ! -s "$file" ]; then
              echo "Snake file is empty: $file"
              exit 1
            fi
            if ! grep -q "<svg" "$file"; then
              echo "Snake file is not valid SVG: $file"
              exit 1
            fi
          done

          for file in dist/analytics/*.svg; do
            if [ ! -s "$file" ]; then
              echo "Analytics file is empty: $file"
              exit 1
            fi
          done

      # ── Push to output branch ─────────────────────────────────────────────
      - name: Deploy everything to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "chore: sync contribution snake, analytics, and profile assets"
